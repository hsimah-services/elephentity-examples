name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clog:
    name: clog / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.3 is the floor. 8.4 runs to catch forward-compatibility breaks early.
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite, mbstring
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: clog

      # The spec compiler is one binary, not a Composer package. Keep the version in step with
      # ELEPH_VERSION in tools/php.
      - name: Install eleph
        env:
          ELEPH_VERSION: 0.16.1
          ELEPH_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          curl -fsSL "https://github.com/hsimah-services/elephentity/releases/download/v$ELEPH_VERSION/install.sh" | sh
          echo "$ELEPH_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Build generators
        working-directory: clog
        env:
          RUSTUP_TOOLCHAIN: stable
        run: composer build-generators

      - name: Code style
        working-directory: clog
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none

      - name: Static analysis
        working-directory: clog
        run: composer stan -- --no-progress

      - name: fmt
        working-directory: clog
        run: eleph fmt

      - name: validate
        working-directory: clog
        run: eleph validate

      - name: generate --check
        working-directory: clog
        run: eleph generate --check

      - name: check
        working-directory: clog
        run: eleph check

      - name: Behavioral contract tests
        working-directory: clog
        run: composer test
