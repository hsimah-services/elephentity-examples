entity: Inventory
description: One stocked instance of an item, in a location, with its own expiry.
use:
  - Record
integrations:
  graphql:
    singular: ClogInventory
    plural: ClogInventoryEntries
storage:
  table: inventory
  handle: clog_inventory
fields:
  name:
    type: string
    description: Display label derived from the item and location before writing.
    required: true
    maxLength: 200
  dateAdded:
    type: datetime
    description: When this instance entered inventory.
    required: true
  dateExpiry:
    type: datetime
    description: When it expires. Absent means it does not.
    nullable: true
edges:
  item:
    to: Item
    cardinality: one
    description: What this entry is an instance of.
    inverse:
      name: inventoryEntries
      unique: false
    onDelete: cascade
  location:
    to: Location
    cardinality: one
    description: Where it is kept.
    inverse:
      name: inventoryEntries
      unique: false
  site:
    to: Site
    cardinality: many
    description: >
      Which building this instance is physically in. Many-to-many allows more than one
      building to be recorded; an entry moving between buildings relinks this edge
      instead of becoming a different row.
